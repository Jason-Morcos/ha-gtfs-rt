name: Integration tests

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install gtfs-realtime-bindings==2.2.0 requests voluptuous
      - run: python -m unittest discover -s tests

  home-assistant:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            python: "3.13"
            install: >-
              pytest-homeassistant-custom-component==0.13.251
              gtfs-realtime-bindings==2.2.0
              "pycares<5"
              -c https://raw.githubusercontent.com/home-assistant/core/2025.6.0/homeassistant/package_constraints.txt
          - name: current
            python: "3.14"
            install: -r requirements_test_ha.txt
    name: Home Assistant (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ${{ matrix.install }}
      - run: python -m pytest -q tests_ha --asyncio-mode=auto
